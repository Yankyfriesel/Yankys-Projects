allowBuilds:
  esbuild: false
  sharp: false
  unrs-resolver: false
  "@parcel/watcher": false
  "@swc/core": false

minimumReleaseAgeExclude:
  - "@electric-sql/pglite@0.5.11"

overrides:
  # next-intl's plugin loads @swc/core. From 1.16.1 on, its Windows native addon
  # refuses to start when a parent of %LOCALAPPDATA% carries extra ACL entries
  # (ERR_SWC_NATIVE_CACHE), which is the case on the development machine.
  # 1.16.0 is the newest release without that check. Revisit when @swc/core
  # ships an opt-out or the machine's ACLs change.
  "@swc/core": 1.16.0
